name: '@nuxt-monorepo-template/vitest-config'
type: module
private: true
license: MIT

description: Base Vitest config for nuxt-monorepo-template

scripts:
  typecheck: tsc

  lint: pnpm lint:es
  lint:es:  eslint --max-warnings 0

  test: pnpm test:unit
  test:watch: pnpm test:unit:watch
  test:unit: vitest run
  test:unit:watch: vitest

exports:
  .:
    types: ./src/index.ts
    module-sync: ./src/index.ts
    default: ./src/index.ts

main: ./src/index.ts
types: ./src/index.ts
module: ./src/index.ts

# Use Node subpath imports to avoid TypeScript path aliases being resolved in the consuming package context
imports:
  '#vitest-config': ./src/index.ts
  '#vitest-config/*':
    - ./src/*
    - ./src/*.ts
    - ./src/*.tsx
    - ./src/*.js
    - ./src/*.jsx
    - ./src/*/index.ts
    - ./src/*/index.tsx
    - ./src/*/index.js
    - ./src/*/index.jsx

peerDependencies:
  '@nuxt/test-utils': catalog:nuxt
  vitest: catalog:testing

peerDependenciesMeta:
  '@nuxt/test-utils':
    optional: true

dependencies:
  defu: catalog:typescript
  type-fest: catalog:typescript

devDependencies:
  '@nuxt-monorepo-template/tsconfig': workspace:*

  '@nuxt-monorepo-template/eslint-config': workspace:*

  eslint: catalog:eslint

  vitest: catalog:testing

  lint-staged: catalog:commit-checks

  nuxt: catalog:nuxt
